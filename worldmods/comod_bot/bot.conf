[BOT]
# Put your Discord bot token here. Never post this token publicly.
bot_token = TOKEN_HERE
command_prefix = !cmd

# Optional: your Discord server ID. If set, /login and /logout appear immediately.
# If 0, commands are synced globally and can take some time to appear.
guild_id = 0

[RELAY]
# Paths are relative to the comod_bot folder.
lua_file_path = Relay/Lua.txt
python_file_path = Relay/Python.txt
report_file_path = Relay/Report.txt
debug_action_file_path = Relay/Debug_action.txt
auth_request_file_path = Relay/Auth_request.txt
auth_response_file_path = Relay/Auth_response.txt
identity_file_path = Relay/Discord_Names.txt

# Replace these with your Discord channel IDs.
relay_channel = 1441900768058671277
report_channel = 1407731604889010237
debug_channel = 1438372948606976181

use_nicknames = True

# 2 seconds is light on CPU and is suitable for Creative Oasis.
cooldown = 0.1
relay_cooldown = 0.05

# Keep this False on Creative Oasis unless you specifically want block/place logs.
enable_debug = True

[LOGIN]
# Minimum delay between /login attempts from the same Discord account.
cooldown = 30
# How long the bot waits for the Luanti server to verify a login.
timeout = 20
